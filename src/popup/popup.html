<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>EnvGuard</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>EnvGuard</h1>
  <button id="add-current">Add current site</button>
  <p id="status-message" class="status-message" hidden></p>

  <div id="manual-add">
    <input id="manual-hostname" type="text" placeholder="hostname.example.com" />
    <select id="manual-environment">
      <option value="dev">dev</option>
      <option value="production">production</option>
    </select>
    <button id="manual-add-btn">Add</button>
  </div>

  <ul id="site-list"></ul>

  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
